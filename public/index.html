<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>SPERMA SHUT</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; touch-action: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; align-items: center; padding-left: 10%; pointer-events: none;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.4) 100%);
        }
        .menu-content { 
            pointer-events: auto; display: flex; flex-direction: column; gap: 15px; 
            background: rgba(0, 0, 0, 0.6); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .game-title { color: white; font-size: 2.5rem; text-shadow: 2px 2px 5px rgba(0,0,0,0.8); font-weight: 900; margin-bottom: 10px; }
        
        input[type="text"] { padding: 10px; font-size: 1.2rem; border-radius: 5px; border: none; text-align: center; }
        
        .settings { color: white; font-size: 1.2rem; display: flex; gap: 20px; justify-content: center; margin: 10px 0; }
        .settings label { cursor: pointer; display: flex; align-items: center; gap: 5px; }
        
        #play-btn {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold; color: white;
            background: #ff2a2a; border: none; border-radius: 8px; text-transform: uppercase; cursor: pointer; border: 2px solid white;
        }
        #play-btn:active { transform: scale(0.95); }

        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; display: none; pointer-events: none; }
        
        #joystick-zone { position: absolute; top: 0; left: 0; width: 50%; height: 100%; pointer-events: auto; }
        #camera-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }
        
        #shoot-btn {
            position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; pointer-events: auto;
            background: rgba(255, 255, 255, 0.8); border: 3px solid #ccc; border-radius: 50%;
            font-weight: bold; color: #333; display: flex; justify-content: center; align-items: center; user-select: none; z-index: 10;
        }
        #shoot-btn:active { background: #fff; transform: scale(0.9); }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: white; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; display: none; pointer-events: none;
        }

        /* Кнопка и меню анимаций */
        #anim-btn {
            position: absolute; top: 20px; right: 20px; padding: 10px 20px; pointer-events: auto;
            background: rgba(0,0,0,0.5); color: white; border: 2px solid white; border-radius: 8px; font-weight: bold; z-index: 11; user-select: none;
        }
        #anim-menu {
            position: absolute; top: 70px; right: 20px; display: none; flex-direction: column; gap: 5px; pointer-events: auto; z-index: 11;
        }
        .anim-option {
            padding: 10px 20px; background: white; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
        }
        .anim-option:active { background: #ccc; }

        .player-name-label {
            color: white; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 2px black, -1px -1px 2px black; margin-top: -20px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="crosshair"></div>

    <div id="main-menu">
        <div class="menu-content">
            <h1 class="game-title">SPERMA SHUT</h1>
            <input type="text" id="nickname-input" placeholder="Ваш никнейм" value="Игрок">
            <div class="settings">
                <label><input type="radio" name="controls" value="mobile" checked> 📱 Телефон</label>
                <label><input type="radio" name="controls" value="pc"> 💻 ПК</label>
            </div>
            <button id="play-btn">В БОЙ</button>
        </div>
    </div>

    <div id="game-ui">
        <div id="joystick-zone"></div>
        <div id="camera-zone"></div>
        <div id="shoot-btn">ОГОНЬ</div>
        
        <!-- Меню анимаций -->
        <div id="anim-btn">АНИМАЦИИ</div>
        <div id="anim-menu">
            <button class="anim-option" data-anim="idle">Стоять</button>
            <button class="anim-option" data-anim="wank">Дрочить</button>
        </div>
    </div>

      <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="game.js"></script>
</body>
</html>

        </div>
    </div>

    <script type="module" src="game.js"></script>
    <script src="/socket.io/socket.io.js"></script>

</body>
</html>
